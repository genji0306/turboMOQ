[project]
name = "turbomoq"
version = "0.2.0"
description = "TurboMOQ: Hybrid KV cache compression — TurboQuant rotation + MOQ topology-aware allocation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
bench = [
    "matplotlib",
]

[tool.setuptools.packages.find]
include = ["turboquant*", "turbomoq*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
